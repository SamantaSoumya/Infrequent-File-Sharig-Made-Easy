name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master        # triggers on every push to master
  workflow_dispatch:  # allows manual trigger from GitHub Actions tab

# Grant GITHUB_TOKEN the permissions needed for Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; cancel in-progress if a new push arrives
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ── Job 1: Build (upload static files as Pages artifact) ──────
  build:
    name: Build & Upload Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the entire repository root (all static files)
          path: '.'

  # ── Job 2: Deploy to GitHub Pages ─────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
